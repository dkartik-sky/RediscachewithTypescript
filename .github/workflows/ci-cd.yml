name: CI / CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Cancel in-flight runs for the same branch so only the latest commit runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "20.x"
  # Docker Hub image names — username comes from repository secret
  API_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/redis-caching-api
  SPA_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/redis-caching-spa

# ═══════════════════════════════════════════════════════════════════════════
# JOB 1 — API: restore → build → test
# ═══════════════════════════════════════════════════════════════════════════
jobs:
  api-build-test:
    name: API — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        # Restoring the test project also restores the API via ProjectReference
        run: dotnet restore RedisCachingApi.Tests/RedisCachingApi.Tests.csproj

      - name: Run tests
        # Integration tests use in-memory cache — no Redis required
        run: |
          dotnet test RedisCachingApi.Tests/RedisCachingApi.Tests.csproj \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: test-results/test-results.trx

# ═══════════════════════════════════════════════════════════════════════════
# JOB 2 — SPA: install → type-check → test → build
# ═══════════════════════════════════════════════════════════════════════════
  spa-build-test:
    name: SPA — Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: redis-caching-spa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: redis-caching-spa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          # URL is embedded in the JS bundle at build time; browser calls this
          VITE_API_URL: http://localhost:5168

# ═══════════════════════════════════════════════════════════════════════════
# JOB 3 — Docker: build images → push to Docker Hub
#          Runs only on push to main/master after both test jobs pass
# ═══════════════════════════════════════════════════════════════════════════
  docker-build-push:
    name: Docker — Build & Push Images
    runs-on: ubuntu-latest
    needs: [api-build-test, spa-build-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    # Expose image digests as job outputs for the deploy job
    outputs:
      api-digest: ${{ steps.push-api.outputs.digest }}
      spa-digest: ${{ steps.push-spa.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Enable multi-platform builds (linux/amd64 + linux/arm64)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derive tags: latest + short git SHA (e.g. sha-a1b2c3d)
      - name: Generate image metadata — API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Generate image metadata — SPA
        id: meta-spa
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SPA_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # ── Build & push API image ──────────────────────────────────────────
      - name: Build & push API image
        id: push-api
        uses: docker/build-push-action@v6
        with:
          context: ./RedisCachingApi
          file: ./RedisCachingApi/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # Layer cache from Docker Hub so rebuilds are fast
          cache-from: type=registry,ref=${{ env.API_IMAGE }}:cache
          cache-to:   type=registry,ref=${{ env.API_IMAGE }}:cache,mode=max

      # ── Build & push SPA image ──────────────────────────────────────────
      - name: Build & push SPA image
        id: push-spa
        uses: docker/build-push-action@v6
        with:
          context: ./redis-caching-spa
          file: ./redis-caching-spa/Dockerfile
          push: true
          tags: ${{ steps.meta-spa.outputs.tags }}
          labels: ${{ steps.meta-spa.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # VITE_API_URL baked into the JS bundle at build time
          build-args: VITE_API_URL=http://localhost:5168
          cache-from: type=registry,ref=${{ env.SPA_IMAGE }}:cache
          cache-to:   type=registry,ref=${{ env.SPA_IMAGE }}:cache,mode=max

      - name: Image summary
        run: |
          echo "### Docker images pushed to Hub" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ env.API_IMAGE }}\` | \`latest\`, \`sha-${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ env.SPA_IMAGE }}\` | \`latest\`, \`sha-${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

# ═══════════════════════════════════════════════════════════════════════════
# JOB 4 — Deploy: pull images and run containers via Docker Desktop
#
# GitHub Actions cannot SSH into a local machine, so this job uses a
# self-hosted runner registered on the target machine (Docker Desktop host).
# See README for setup instructions.
# ═══════════════════════════════════════════════════════════════════════════
  deploy-docker-desktop:
    name: Deploy — Docker Desktop
    runs-on: self-hosted          # runner must be registered on your machine
    needs: docker-build-push
    environment: local            # optional: add a manual approval gate in GitHub

    steps:
      - name: Checkout (for docker-compose.yml)
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest images
        run: |
          docker pull ${{ env.API_IMAGE }}:latest
          docker pull ${{ env.SPA_IMAGE }}:latest

      - name: Deploy stack with Docker Compose
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker compose -f docker-compose.yml down --remove-orphans
          docker compose -f docker-compose.yml up -d --pull always

      - name: Verify containers are running
        run: |
          docker compose -f docker-compose.yml ps
          echo "API:  http://localhost:5168/swagger"
          echo "SPA:  http://localhost:5174"
